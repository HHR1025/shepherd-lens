[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd-lens-api"
version = "0.1.0"
description = "Optional deterministic analysis API for Shepherd Lens"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "uvicorn>=0.38,<1",
]

[project.scripts]
shepherd-lens-evaluate-evidence = "shepherd_lens_api.evidence_evaluation_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shepherd_lens_api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
