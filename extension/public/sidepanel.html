<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shepherd Lens</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070b;
        color: #e5f7ff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: stretch;
        background:
          radial-gradient(circle at 20% 20%, rgba(20, 184, 166, 0.18), transparent 34%),
          radial-gradient(circle at 80% 12%, rgba(125, 92, 255, 0.2), transparent 30%),
          #05070b;
      }

      main {
        width: 100%;
        padding: 18px;
      }

      .panel {
        min-height: calc(100vh - 36px);
        overflow: hidden;
        border: 1px solid rgba(148, 252, 255, 0.18);
        border-radius: 22px;
        background:
          radial-gradient(circle at 18% 12%, rgba(45, 212, 191, 0.22), transparent 34%),
          radial-gradient(circle at 88% 0%, rgba(125, 92, 255, 0.22), transparent 32%),
          rgba(6, 16, 24, 0.78);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.58), 0 0 48px rgba(20, 184, 166, 0.18);
        padding: 22px;
      }

      .eyebrow {
        color: rgba(165, 243, 252, 0.72);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.32em;
        margin: 0;
        text-transform: uppercase;
      }

      h1 {
        color: #f8fafc;
        font-size: 24px;
        line-height: 1.15;
        margin: 10px 0 22px;
      }

      .signal {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.055);
        margin-top: 12px;
        padding: 16px;
      }

      .label {
        color: rgba(203, 213, 225, 0.62);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        margin: 0;
        text-transform: uppercase;
      }

      .value {
        color: #ecfeff;
        font-size: 18px;
        font-weight: 700;
        margin: 8px 0 0;
      }

      p {
        margin: 8px 0 0;
        color: rgba(229, 247, 255, 0.68);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <p class="eyebrow">Shepherd Lens</p>
        <h1>Attention Atmosphere</h1>

        <div class="signal">
          <p class="label">Current Feed Atmosphere</p>
          <p class="value">emotionally accelerated</p>
        </div>

        <div class="signal">
          <p class="label">Algorithmic Pressure</p>
          <p class="value">moderate</p>
        </div>

        <div class="signal">
          <p class="label">Attention Climate</p>
          <p class="value">unstable</p>
        </div>
      </section>
    </main>
  </body>
</html>
